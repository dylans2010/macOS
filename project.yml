name: Comet
options:
  bundleIdPrefix: com.dylans2010
  deploymentTarget:
    macOS: "15.0"
packages:
  ComposableArchitecture:
    url: https://github.com/pointfreeco/swift-composable-architecture
    exactVersion: 1.26.2
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Comet:
    type: application
    platform: macOS
    sources:
      - path: macOS/Comet
        excludes: [Resources/Reader]
      # Mozilla's Readability and its license.
      - path: macOS/Comet/Resources/Reader
        buildPhase: resources
      # uBlock Origin, from macOS/scripts/fetch-ublock.sh.
      - path: macOS/Extensions/uBlock0.chromium
        type: folder
    dependencies:
      - package: ComposableArchitecture
      - package: Sparkle
      - framework: macOS/Frameworks/EngineCore.framework
        embed: true
      - target: DockTile
        copy:
          destination: plugins
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dylans2010.Comet
        PRODUCT_NAME: Comet
        INFOPLIST_FILE: macOS/Comet/Info.plist
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        APP_NAME: Comet
        DATA_FOLDER: Comet
        CODE_SIGN_ENTITLEMENTS: macOS/scripts/entitlements/app.plist
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.dylans2010.Comet.debug
          DATA_FOLDER: Comet Debug
          # Tells the Debug app apart from Comet in the default browser list.
          APP_NAME: Comet Dev
  # The Dock tile plug-in: shows the icon chosen in Settings while the app is not running.
  DockTile:
    type: bundle
    platform: macOS
    sources: [macOS/DockTile, macOS/Comet/Settings/AppIcon.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dylans2010.Comet.docktile
        WRAPPER_EXTENSION: docktileplugin
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: DockTilePlugIn
        SWIFT_VERSION: "5.0"
  CometTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - macOS/CometTests
    dependencies:
      - target: Comet
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        FRAMEWORK_SEARCH_PATHS: $(PROJECT_DIR)/macOS/Frameworks
schemes:
  Comet:
    build:
      targets:
        Comet: all
    test:
      targets: [CometTests]
